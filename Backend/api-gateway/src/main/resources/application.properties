# =====================================================================
# EduConnect - API Gateway
# =====================================================================
spring.application.name=api-gateway
server.port=8090

# Profil par defaut : routage dynamique via Eureka (Partie 3, methode 2).
# Surchargeable au demarrage :
#   --spring.profiles.active=static          (Partie 2, methode 1 - classe)
#   --spring.profiles.active=static-props    (Partie 2, methode 2 - properties)
#   --spring.profiles.active=dynamic         (Partie 3, methode 2 - properties)
#   --spring.profiles.active=dynamic-class   (Partie 3, methode 1 - classe)
spring.profiles.active=dynamic

# ---------------------------------------------------------------------
# Eureka Client
# ---------------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=5

# ---------------------------------------------------------------------
# Logs de routage (TP Partie 3 - question 2.a)
# Permettent de voir l'instance Eureka selectionnee pour chaque requete.
# ---------------------------------------------------------------------
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# ---------------------------------------------------------------------
# Actuator : visualisation des routes de la Gateway
# http://localhost:8080/actuator/gateway/routes
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
management.info.env.enabled=true

info.app.name=API Gateway
info.app.version=1.0.0
info.app.description=Point d'entree unique de la plateforme EduConnect

