# =====================================================================
# TP - Partie 3, methode 2 : routage DYNAMIQUE via application.properties
# =====================================================================
# Le schema lb:// demande a la Gateway de resoudre le nom du service
# aupres d'Eureka, puis d'appliquer le load balancing.
#
# Attention : depuis Spring Cloud Gateway 5.x, le prefixe est
# spring.cloud.gateway.server.webflux (l'ancien spring.cloud.gateway
# est ignore).

spring.cloud.gateway.server.webflux.routes[0].id=candidat-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://candidat-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/candidats/**

spring.cloud.gateway.server.webflux.routes[1].id=job-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://job-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/jobs/**
