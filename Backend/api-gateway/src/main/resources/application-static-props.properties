# =====================================================================
# TP - Partie 2, methode 2 : routage STATIQUE via application.properties
# =====================================================================
# Les URI pointent directement vers les ports des microservices.
# Eureka n'est pas utilise pour resoudre la destination.

spring.cloud.gateway.server.webflux.routes[0].id=candidat-static
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/candidats/**

spring.cloud.gateway.server.webflux.routes[1].id=job-static
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/jobs/**
